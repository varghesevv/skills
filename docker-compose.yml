# Local development. Server (demo) compose file: infra/docker/compose.demo.yml (phase 7b).
name: skills

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-skills}:${POSTGRES_PASSWORD:-skills}@db:5432/${POSTGRES_DB:-skills}
  ENVIRONMENT: ${ENVIRONMENT:-local}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Dubai}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skills}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skills}
      POSTGRES_DB: ${POSTGRES_DB:-skills}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skills} -d ${POSTGRES_DB:-skills}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.worker
    environment: *backend-env
    healthcheck:
      disable: true   # the image's HTTP health check only applies to the api service
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
