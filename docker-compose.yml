# Local development. Server (demo) compose file: infra/docker/compose.demo.yml (phase 7b).
name: skills

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Run make env to create or complete .env}:${POSTGRES_PASSWORD:?Run make env to create or complete .env}@db:5432/${POSTGRES_DB:?Run make env to create or complete .env}
  ENVIRONMENT: ${ENVIRONMENT:?Run make env to create or complete .env}
  CORS_ORIGINS: ${CORS_ORIGINS:?Run make env to create or complete .env}
  REPORT_TIMEZONE: ${REPORT_TIMEZONE:?Run make env to create or complete .env}
  REPORTS_OUTPUT_DIR: /data/reports   # a volume shared by api and worker
  JWT_SECRET: ${JWT_SECRET:?Run make env to create or complete .env}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:?Run make env to create or complete .env}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:?Run make env to create or complete .env}
  RESET_TOKEN_MINUTES: ${RESET_TOKEN_MINUTES:?Run make env to create or complete .env}
  LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:?Run make env to create or complete .env}
  LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:?Run make env to create or complete .env}
  REVEAL_MAX_PER_HOUR: ${REVEAL_MAX_PER_HOUR:-10}
  REVEAL_MAX_PER_DAY: ${REVEAL_MAX_PER_DAY:-20}
  TERMINOLOGY_PROFILE: ${TERMINOLOGY_PROFILE:-default}
  APP_MIN_VERSION: ${APP_MIN_VERSION:-0.0.0}
  APP_LATEST_VERSION: ${APP_LATEST_VERSION:-0.0.0}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?Run make env to create or complete .env}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run make env to create or complete .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env to create or complete .env}
      POSTGRES_DB: ${POSTGRES_DB:?Run make env to create or complete .env}
    ports:
      - "${DB_PORT:?Run make env to create or complete .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Run make env to create or complete .env} -d ${POSTGRES_DB:?Run make env to create or complete .env}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment: *backend-env
    ports:
      - "${API_PORT:?Run make env to create or complete .env}:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - reports_data:/data/reports
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.worker
    environment: *backend-env
    healthcheck:
      disable: true   # the image's HTTP health check only applies to the api service
    volumes:
      - ./backend:/app
      - /app/.venv
      - reports_data:/data/reports
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8000
      VITE_TERMINOLOGY_PROFILE: ${TERMINOLOGY_PROFILE:-default}
    ports:
      - "${WEB_PORT:?Run make env to create or complete .env}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  reports_data:
