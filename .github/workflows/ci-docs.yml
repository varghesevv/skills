name: ci-docs

on:
  pull_request:
  push:
    branches: [main]
    paths: ["docs/**", "**/*.md"]

permissions:
  contents: read

jobs:
  docs:
    # Never run for pull requests from forks (see docs/operations-runbook.md).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: docs-links
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every ADR file is listed in the ADR index
        run: |
          status=0
          for f in docs/adr/[0-9][0-9][0-9][0-9]-*.md; do
            name=$(basename "$f")
            if ! grep -q "($name)" docs/adr/README.md; then
              echo "Missing from docs/adr/README.md: $name"; status=1
            fi
          done
          exit $status
      - name: Check relative Markdown links
        # A small script instead of lychee: the lychee binary needs a newer glibc than the
        # self-hosted runner has. Web addresses are not visited (the old check was offline too).
        run: python3 scripts/check-md-links.py .
      - name: Every pull request job has the fork guard
        # Keeps fork pull requests away from our runners and secrets (operations runbook, "Pull requests from forks").
        run: python3 scripts/check-fork-guard.py .
