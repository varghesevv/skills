name: ci-infra

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/ci-infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/ci-infra.yml"]

permissions:
  contents: read

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Shell scripts (shellcheck)
        run: shellcheck infra/scripts/*.sh

      - name: Server compose file is valid
        # Throwaway values only, to prove that every variable the file needs is listed.
        run: |
          export ENVIRONMENT=demo SITE_ADDRESS=example.test FRONTEND_BASE_URL=https://example.test
          export CORS_ORIGINS=https://example.test REPORT_TIMEZONE=UTC GHCR_OWNER=owner IMAGE_TAG=test
          export POSTGRES_USER=skills POSTGRES_DB=skills ACCESS_TOKEN_MINUTES=15 REFRESH_TOKEN_DAYS=30
          export RESET_TOKEN_MINUTES=60 LOGIN_MAX_FAILURES=5 LOGIN_WINDOW_MINUTES=15
          export POSTGRES_PASSWORD=$(openssl rand -hex 12) JWT_SECRET=$(openssl rand -hex 24)
          docker compose --env-file /dev/null -f infra/docker/compose.demo.yml config --quiet

      - name: Every setting the application needs is in the demo example
        run: |
          for name in $(grep -oE '^[A-Z_]+=' .env.example | tr -d '='); do
            case "$name" in DB_PORT|API_PORT|WEB_PORT|REPORTS_OUTPUT_DIR) continue ;; esac
            grep -q "^${name}=" infra/docker/demo.env.example || { echo "demo.env.example is missing ${name}"; exit 1; }
          done

      - name: Caddyfile is valid
        run: |
          docker run --rm -e SITE_ADDRESS=example.test -v "$PWD/infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"

      - name: Format
        run: terraform fmt -check -recursive -diff infra/terraform

      - name: Validate (no AWS access needed)
        run: |
          for dir in infra/terraform/bootstrap infra/terraform/envs/demo; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
      - name: tflint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/infra/terraform/.tflint.hcl"

      - name: Security scan of the Terraform (trivy config)
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:0.58.1 \
            config --severity HIGH,CRITICAL --exit-code 1 --ignorefile infra/terraform/.trivyignore \
            infra/terraform

  # Shows what a pull request would change in AWS. It runs only once the bootstrap exists and
  # the repository variables below are set, so the checks above work before that.
  plan:
    needs: terraform
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_TERRAFORM_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Plan
        id: plan
        working-directory: infra/terraform/envs/demo
        shell: bash # with pipefail, so a failed plan fails the step even though it is piped to tee
        env:
          TF_VAR_ssh_allowed_cidrs: ${{ vars.TF_SSH_ALLOWED_CIDRS }}
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform plan -input=false -no-color -lock-timeout=60s | tee plan.txt
      - name: Comment the plan on the pull request
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const file = 'infra/terraform/envs/demo/plan.txt';
            let text = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : 'The plan did not run.';
            if (text.length > 60000) text = text.slice(0, 60000) + '\n... (cut)';
            const body = '### Terraform plan (envs/demo)\n```\n' + text + '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
