name: ci-backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, pi]
    # Runs on the Raspberry Pi. Never run code from fork pull requests on it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: ci
      CORS_ORIGINS: http://localhost:5173
      REPORT_TIMEZONE: Asia/Dubai
      REPORTS_OUTPUT_DIR: reports_output
      FRONTEND_BASE_URL: http://localhost:5173
      ACCESS_TOKEN_MINUTES: "15"
      REFRESH_TOKEN_DAYS: "30"
      RESET_TOKEN_MINUTES: "60"
      LOGIN_MAX_FAILURES: "5"
      LOGIN_WINDOW_MINUTES: "15"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skills
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: skills
        ports: ["5432"]   # random free host port, so it never clashes with the dev database on the Pi
        options: >-
          --health-cmd "pg_isready -U skills -d skills"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Require the CI_DB_PASSWORD repository secret
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          # Letters and digits only, at least 16: safe inside a connection URL. Prints no value.
          bad=0
          case "$CI_DB_PASSWORD" in
            ''|*[!A-Za-z0-9]*) bad=1 ;;
          esac
          [ "${#CI_DB_PASSWORD}" -ge 16 ] || bad=1
          if [ "$bad" -ne 0 ]; then
            echo "::error::Repository secret CI_DB_PASSWORD is missing or invalid. It must be at least 16 letters and digits, with no spaces, newline or symbols. Recreate it with: openssl rand -hex 24 | tr -d '\n' | pbcopy"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install dependencies
        run: uv sync --python 3.12
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Tests (includes migration up/down on PostgreSQL)
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          export DATABASE_URL="postgresql+psycopg://skills:${CI_DB_PASSWORD}@localhost:${DB_PORT}/skills"
          uv run pytest --cov=app --cov-report=term-missing
      - name: Export OpenAPI schema
        run: uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi(), indent=2, sort_keys=True))" > openapi.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-schema
          path: backend/openapi.json

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.12
      - name: Dependency vulnerability audit
        run: uv run pip-audit --skip-editable
