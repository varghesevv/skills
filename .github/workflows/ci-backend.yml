name: ci-backend

on:
  pull_request:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: backend-test
    runs-on: [self-hosted, Linux]
    # Runs on a self-hosted runner (the Raspberry Pi or the Linux x64 container runner). Never run code
    # from fork pull requests on it. PostgreSQL is started by scripts/ci-postgres.sh because GitHub does
    # not allow service containers on a runner that runs inside a container.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: ci
      CORS_ORIGINS: http://localhost:5173
      REPORT_TIMEZONE: Asia/Dubai
      REPORTS_OUTPUT_DIR: reports_output
      FRONTEND_BASE_URL: http://localhost:5173
      ACCESS_TOKEN_MINUTES: "15"
      REFRESH_TOKEN_DAYS: "30"
      RESET_TOKEN_MINUTES: "60"
      LOGIN_MAX_FAILURES: "5"
      LOGIN_WINDOW_MINUTES: "15"
      REVEAL_MAX_PER_HOUR: "10"
      REVEAL_MAX_PER_DAY: "20"
    steps:
      - name: Require the CI_DB_PASSWORD repository secret
        # Runs before checkout, so the job's default folder (backend) does not exist yet on a fresh runner.
        working-directory: .
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          # Letters and digits only, at least 16: safe inside a connection URL. Prints no value.
          bad=0
          case "$CI_DB_PASSWORD" in
            ''|*[!A-Za-z0-9]*) bad=1 ;;
          esac
          [ "${#CI_DB_PASSWORD}" -ge 16 ] || bad=1
          if [ "$bad" -ne 0 ]; then
            echo "::error::Repository secret CI_DB_PASSWORD is missing or invalid. It must be at least 16 letters and digits, with no spaces, newline or symbols. Recreate it with: openssl rand -hex 24 | tr -d '\n' | pbcopy"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Start PostgreSQL
        working-directory: .
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: scripts/ci-postgres.sh start
      - name: Install dependencies
        run: uv sync --python 3.12
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Tests (includes migration up/down on PostgreSQL)
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          export DATABASE_URL="postgresql+psycopg://skills:${CI_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/skills"
          uv run pytest --cov=app --cov-report=term-missing
      - name: OpenAPI contract is current (docs/openapi.json)
        run: uv run python -m app.openapi_export --check
      - name: Stop PostgreSQL
        if: always()
        working-directory: .
        run: scripts/ci-postgres.sh stop

  audit:
    # Never run for pull requests from forks (see docs/operations-runbook.md).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: backend-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --python 3.12
      - name: Dependency vulnerability audit
        run: uv run pip-audit --skip-editable
