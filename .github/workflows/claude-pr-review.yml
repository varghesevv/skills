name: Claude PR Review (manual)

# Manual, advisory second opinion from the Claude API. Run it from the Actions tab with a PR number.
# The script and review brief come from the default branch, never from the PR. See docs/adr/0013.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number'
        required: true
        type: string
      components:
        description: 'Optional: only review these components (comma separated: backend, frontend, mobile, infra, ci, docs)'
        required: false
        type: string
      focus:
        description: 'Optional: what to look at most closely (up to 300 characters)'
        required: false
        type: string

concurrency:
  group: claude-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fetch PR Diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ inputs.pr_number }}
        run: |
          if ! [[ "$PR_NUM" =~ ^[0-9]+$ ]]; then
            echo "Error: PR number must be numeric. Got: '$PR_NUM'"
            exit 1
          fi
          gh pr diff "$PR_NUM" > pr_raw.diff

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install --no-cache-dir "anthropic>=0.40,<1"

      - name: Unit tests for the review script
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Execute Claude Review Agent
        env:
          REVIEW_PROVIDER: claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_COMPONENTS: ${{ inputs.components }}
          REVIEW_FOCUS: ${{ inputs.focus }}
        run: python .github/scripts/review_agent.py
