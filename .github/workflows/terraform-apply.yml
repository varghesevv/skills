name: terraform-apply

# Applies the demo Terraform stack. Manual only, from main, and the Environment `demo`
# approval gates the run. The plan is shown before the apply step.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-demo
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform/envs/demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.10.5
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Plan
        env:
          TF_VAR_ssh_allowed_cidrs: ${{ vars.TF_SSH_ALLOWED_CIDRS }}
        run: terraform plan -input=false -out=tfplan
      - name: Apply
        run: terraform apply -input=false tfplan
