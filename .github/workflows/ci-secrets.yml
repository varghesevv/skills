name: ci-secrets

# Blocks a pull request that adds passwords, keys or tokens. Output never shows the secret:
# the repository rules print file and line only, and gitleaks runs with --redact.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    # Never run for pull requests from forks (see docs/operations-runbook.md).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: secrets-scan
    runs-on: [self-hosted, Linux, pi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Repository secret rules
        run: sh scripts/check-secrets.sh
      - name: Gitleaks, every commit in this pull request
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh zricethezav/gitleaks:v8.21.2 -c \
            'git config --global --add safe.directory /repo && gitleaks detect --source /repo --redact --no-banner --log-opts="origin/${{ github.base_ref }}..HEAD"'
      - name: Gitleaks, current files
        if: github.event_name == 'push'
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh zricethezav/gitleaks:v8.21.2 -c \
            'git config --global --add safe.directory /repo && gitleaks detect --source /repo --no-git --redact --no-banner'
