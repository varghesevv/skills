name: Gemini Advisory PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number'
        required: true
        type: string

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # 1. Allow workflow_dispatch OR valid non-draft, non-dependabot internal PRs
    if: >-
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.draft == false &&
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      # 2. Security: Always check out trusted target base branch, NEVER the untrusted PR branch
      - name: Checkout trusted base repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      # 3. Input validation and diff download
      - name: Fetch PR Diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          if ! [[ "$PR_NUM" =~ ^[0-9]+$ ]]; then
            echo "Error: PR_NUM must be a numeric value. Got: '$PR_NUM'"
            exit 1
          fi
          gh pr diff "$PR_NUM" > pr_raw.diff

      - name: Set up Python
        uses: actions/setup-python@0b7f8abb15081810e37153f72256750089578505 # v5.3.0
        with:
          python-version: '3.11'

      # 4. Pinned dependency
      - name: Install Dependencies
        run: pip install --no-cache-dir "google-genai>=1.0.0,<2.0.0"

      - name: Unit tests for the review script
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Execute Gemini Review Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python .github/scripts/review_agent.py