name: build-images

# Builds the api and web images, scans them, and pushes them to GHCR tagged with the git SHA
# (and `demo` for the newest one). The deploy workflow picks the image up from there.
on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".release-please-manifest.json", ".github/workflows/build-images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: skills-api
            context: backend
          - image: skills-web
            context: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the previous commit is needed to see whether this is a release commit

      # Version of this build. The release PR (release-please) changes .release-please-manifest.json,
      # so a commit that changes it is the release commit: its images are the release, tagged
      # vX.Y.Z and X.Y.Z. Every other build is X.Y.Z-dev.<short sha>, where X.Y.Z is the last release.
      - name: Work out the version
        id: version
        run: |
          base="$(jq -r '.["."]' .release-please-manifest.json)"
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version in .release-please-manifest.json is not X.Y.Z" >&2
            exit 1
          fi
          # only a change to the file counts; adding it (the first time) is not a release
          if git diff --diff-filter=M --quiet HEAD^ HEAD -- .release-please-manifest.json; then
            echo "value=${base}-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=${base}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Work out the image name
        id: name
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once into the local Docker store and scan it. Nothing is pushed if the scan fails.
      - name: Build (not pushed yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.name.outputs.ref }}:scan
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan for vulnerabilities (fail on critical)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "${{ steps.name.outputs.ref }}:scan"

      - name: Show the version
        run: echo "Version ${{ steps.version.outputs.value }} (release=${{ steps.version.outputs.release }})"

      # The layers are cached, so this second build only adds the push.
      - name: Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.ref }}:${{ github.sha }}
            ${{ steps.name.outputs.ref }}:demo
            ${{ steps.version.outputs.release == 'true' && format('{0}:v{1}', steps.name.outputs.ref, steps.version.outputs.value) || '' }}
            ${{ steps.version.outputs.release == 'true' && format('{0}:{1}', steps.name.outputs.ref, steps.version.outputs.value) || '' }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
