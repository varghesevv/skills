name: ci-frontend

on:
  pull_request:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: frontend-test
    runs-on: [self-hosted, Linux]
    # Runs on the Raspberry Pi. Never run code from fork pull requests on it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit (high severity and above)
        run: npm audit --audit-level=high

  # Responsive layout checks (docs/specification/06-frontend.md, acceptance criterion 4).
  # Runs in a real browser on a GitHub-hosted runner: the browser needs system libraries that
  # the self-hosted runners do not have, and the checks use a mocked API, so no secrets or
  # database are involved.
  responsive:
    # Never run for pull requests from forks (see docs/operations-runbook.md).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: frontend-responsive
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check the layout at the five reference viewports
        run: npx playwright test
        env:
          CI: "true"
      - name: Keep the screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: responsive-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
