# Demo server compose file. Copied to /opt/skills by the deploy workflow, next to the .env file
# the workflow writes from the GitHub Environment `demo`. Local development uses the root
# docker-compose.yml instead.
#
# Only `proxy` publishes ports. `db`, `api`, `worker` and `web` are reachable only on the
# internal compose network.
name: skills-demo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?missing in .env}:${POSTGRES_PASSWORD:?missing in .env}@db:5432/${POSTGRES_DB:?missing in .env}
  ENVIRONMENT: ${ENVIRONMENT:?missing in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:?missing in .env}
  REPORT_TIMEZONE: ${REPORT_TIMEZONE:?missing in .env}
  REPORTS_OUTPUT_DIR: /data/reports
  JWT_SECRET: ${JWT_SECRET:?missing in .env}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:?missing in .env}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:?missing in .env}
  RESET_TOKEN_MINUTES: ${RESET_TOKEN_MINUTES:?missing in .env}
  LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:?missing in .env}
  LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:?missing in .env}
  REVEAL_MAX_PER_HOUR: ${REVEAL_MAX_PER_HOUR:?missing in .env}
  REVEAL_MAX_PER_DAY: ${REVEAL_MAX_PER_DAY:?missing in .env}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?missing in .env}

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?missing in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep them across restarts
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  web:
    image: ghcr.io/${GHCR_OWNER:?missing in .env}/skills-web:${IMAGE_TAG:?missing in .env}
    restart: unless-stopped
    logging: *logging
    environment:
      TERMINOLOGY_PROFILE: ${TERMINOLOGY_PROFILE:-default}

  api:
    image: ghcr.io/${GHCR_OWNER:?missing in .env}/skills-api:${IMAGE_TAG:?missing in .env}
    restart: unless-stopped
    logging: *logging
    # Behind the proxy: trust the forwarded client address so login throttling sees real
    # addresses. Safe because only the proxy can reach this container.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    environment: *backend-env
    volumes:
      - /opt/skills/data/reports:/data/reports
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: ghcr.io/${GHCR_OWNER:?missing in .env}/skills-api:${IMAGE_TAG:?missing in .env}
    restart: unless-stopped
    logging: *logging
    command: python -m app.worker
    environment: *backend-env
    healthcheck:
      disable: true # the image's HTTP health check only applies to the api service
    volumes:
      - /opt/skills/data/reports:/data/reports
    depends_on:
      db:
        condition: service_healthy

  # One-off operator commands (seed data, create an admin). Not started by `up`; run with
  #   docker compose --env-file .env -f compose.demo.yml run --rm tools python -m app.cli ...
  # Only this service receives DEMO_USER_PASSWORD, so the long-running containers never have it.
  tools:
    image: ghcr.io/${GHCR_OWNER:?missing in .env}/skills-api:${IMAGE_TAG:?missing in .env}
    profiles: ["tools"]
    logging: *logging
    environment:
      <<: *backend-env
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
    healthcheck:
      disable: true
    volumes:
      - /opt/skills/data/reports:/data/reports
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:?missing in .env}
    volumes:
      - /opt/skills/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  # pgAdmin, started only when needed (see docs/operations-runbook.md). It listens on the
  # server's own address (127.0.0.1) and is reached through an SSH tunnel, never from the internet.
  #   docker compose --env-file .env -f compose.demo.yml --profile pgadmin up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4:9.6
    profiles: ["pgadmin"]
    restart: "no"
    logging: *logging
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-} # set by the PGADMIN_PASSWORD secret; pgAdmin will not start without it
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: "5050"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgadmin_data:
  caddy_data:
  caddy_config:
